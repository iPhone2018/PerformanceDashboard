name: Build Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write          # ← 新增：不写这行，打 tag 时发 Release 会 403

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt      # ← 原来写的是 requirements.txt

      - name: Smoke test
        run: python -c "import timer_get_data as t; print('ok, DATA_ROOT =', t.DATA_ROOT)"

      - name: Build EXE with PyInstaller
        run: pyinstaller --onefile --console --exclude-module fcntl --name "dna-collector" timer_get_data.py

      - name: Rename for distribution
        run: Copy-Item dist/dna-collector.exe "dist/定时更新工具.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/定时更新工具.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/定时更新工具.exe
